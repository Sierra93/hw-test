version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 22181:2181
    networks:
      - calendar-network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    networks:
      - calendar-network

  pdb:
    image: postgres:13
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5430:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - calendar-network

  migrations:
    build:
      context: ..
      dockerfile: build/migrations/Dockerfile
    environment:
      DB_HOST: pdb
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: calendar_db
      DB_STRING: postgres://user:password@pdb:5432/calendar_db?sslmode=disable
    depends_on:
      - pdb
    networks:
      - calendar-network

  calendar:
    build:
      context: ..
      dockerfile: build/calendar/Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - migrations
    networks:
      - calendar-network

  scheduler:
    build:
      context: ..
      dockerfile: build/scheduler/Dockerfile
    depends_on:
      - kafka
    networks:
      - calendar-network

  storer:
    build:
      context: ..
      dockerfile: build/storer/Dockerfile
    depends_on:
      - kafka
    networks:
      - calendar-network

volumes:
  db-data:

networks:
  calendar-network: