rabbitmq:
  uri: "amqp://user:password@rabbitmq:5672/"
  queue: "event-notifications"
  exchange: "calendar"
  routing_key: "event.notifications"
  max_retries: 5

datasource:
  # storagetype: "memory"
  storagetype: "sql"
  dsn: "postgres://user:password@pdb:5432/calendar_db?sslmode=disable"

logger:
  level: "DEBUG" # "ERROR", "WARN", "INFO", "DEBUG"